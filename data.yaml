# NEU-DET 数据集配置
# path 为相对路径，按「当前工作目录」解析，所以请从项目根目录运行脚本
# （train.py 内部已自动切换到项目根目录，无需手动处理）

path: dataset/NEU-DET
train: train/images
val: train/images          # 同一目录，ultralytics 自动从 train 切 20% 做 val
# test: 暂不指定

# 类别数
nc: 6

# 类别名称（按 YOLO 类别 ID 顺序，0~5）
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches
